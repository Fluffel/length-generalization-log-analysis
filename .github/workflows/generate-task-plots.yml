name: Generate and deploy plots

on:
  push:
    branches:
      - main
    paths:
      - "logs/**"
      - "scripts/**"
      - "site/index.html"
      - ".github/workflows/generate-task-plots.yml"

  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  # Never cancel a running deployment: cancelling between the build and the
  # deploy job leaves the site on the previous, older artifact.
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install pandas matplotlib seaborn

      - name: Generate summary CSV
        run: python scripts/generate_summary_csv.py --num-bins 3 --csv summary.csv

      - name: Generate SSM plots
        run: python scripts/update_ssm_plots.py --arch olmossm

      - name: Check every published plot came from this run
        # Second line of defence behind update_ssm_plots.py: the artifact must
        # never contain an SVG left over from the checkout.
        run: |
          stale=$(find site/plots -name '*.svg' ! -newer summary.csv -print)
          if [ -n "$stale" ]; then
            echo "Plots older than the summary CSV would be published:"
            echo "$stale"
            exit 1
          fi
          echo "All $(find site/plots -name '*.svg' | wc -l) plots are current."

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
