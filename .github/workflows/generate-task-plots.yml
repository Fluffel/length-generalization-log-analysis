name: Generate and deploy plots

on:
  push:
    branches:
      - main
    paths:
      - "logs/**"
      - "scripts/**"
      - "site/index.html"
      - ".github/workflows/generate-task-plots.yml"

  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  # Never cancel a running deployment: cancelling between the build and the
  # deploy job leaves the site on the previous, older artifact.
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install pandas matplotlib seaborn

      - name: Generate summary CSV
        run: python scripts/generate_summary_csv.py --csv summary.csv

      - name: Generate SSM plots
        run: python scripts/update_plots.py --arch ssm

      - name: Generate Hybrid plots
        run: python scripts/update_plots.py --arch hyb

      - name: Generate LM plots
        run: python scripts/update_plots.py --arch lm

      - name: Check every published plot came from this run
        # Second line of defence behind update_plots.py: drop leftover SVGs
        # from the checkout rather than failing the job.  Missing plots are
        # expected when a task has no (or incomplete) runs; the HTML page
        # already shows "no plot generated" for those panels.
        run: |
          stale=$(find site/plots -name '*.svg' ! -newer summary.csv -print)
          if [ -n "$stale" ]; then
            echo "Removing plots older than the summary CSV:"
            echo "$stale"
            echo "$stale" | xargs rm -f
          fi
          echo "All $(find site/plots -name '*.svg' | wc -l) plots are current."

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
