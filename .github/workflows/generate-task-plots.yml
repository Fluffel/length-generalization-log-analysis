name: Generate Task plots

on:
  push:
    paths:
      - "logs/**"

permissions:
  contents: write

jobs:
  generate-plots:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install pandas matplotlib seaborn

      - name: Generate plots
        run: |
          python scripts/generate_summary_csv.py --num-bins 3 --csv summary.csv
          python scripts/update_ssm_plots.py --arch olmossm

      - name: Commit generated files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add summary.csv plots/ formal_olmossm_plots.html tasks_olmossm_plots.html

          if ! git diff --cached --quiet; then
            git commit -m "Update generated plots and summaries"
            git push
          fi